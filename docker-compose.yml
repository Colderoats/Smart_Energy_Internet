services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sei_timescaledb
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sei_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sei_password}
      POSTGRES_DB: ${POSTGRES_DB:-sei_db}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sei_user} -d ${POSTGRES_DB:-sei_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  timescaledb_data:
